syntax = "proto3";

package sdk;

// SDK proxy serves under package "sdk".
// gRPC path: /sdk.DemoService/GetInfo -> matches ALB rule /sdk.*
// Forwards to VPC Lattice User Service (SdkTaskRole is authorized only
// for User Service; denied at Order Service).
service DemoService {
  rpc GetInfo (InfoRequest) returns (InfoResponse);
}

message InfoRequest {
  string id = 1;
}

message InfoResponse {
  string service_name = 1;
  string request_id = 2;
  string client_id = 3;
  string client_scope = 4;
  string client_sub = 5;
  string message = 6;
}
