syntax = "proto3";

package envoy;

// Envoy proxy serves under package "envoy".
// gRPC path: /envoy.DemoService/GetInfo -> matches ALB rule /envoy.*
// Forwards to VPC Lattice Order Service (EnvoyTaskRole is authorized only
// for Order Service; denied at User Service).
service DemoService {
  rpc GetInfo (InfoRequest) returns (InfoResponse);
}

message InfoRequest {
  string id = 1;
}

message InfoResponse {
  string service_name = 1;
  string request_id = 2;
  string client_id = 3;
  string client_scope = 4;
  string client_sub = 5;
  string message = 6;
}
